name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::160885277863:role/GitHubActions-Gatus-OIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform Lint
        run: tflint

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve

      - name: Write job summary
        if: always()
        run: |
          echo "## Terraform Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AWS Region:** ${{ secrets.AWS_REGION }}" >> "$GITHUB_STEP_SUMMARY"
