name: Deploy Gatus

on:
  push:
    branches:
      - main
    paths:
      - "GatusApp/**"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: my-gatus
  ECS_CLUSTER: my-gatus-cluster
  ECS_SERVICE: my-gatus-service
  ECS_TASK_DEFINITION: my-gatus
  ECS_CONTAINER_NAME: gatus

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f GatusApp/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} \
            --push \
            .

      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error \
            https://tm.shuaybali.com/health

      - name: Write job summary
        if: always()
        run: |
          echo "## Gatus Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger:** $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ECR Repository:** $ECR_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ECS Cluster:** $ECS_CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ECS Service:** $ECS_SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Application:** https://tm.shuaybali.com" >> "$GITHUB_STEP_SUMMARY"
